<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css"> 
    <title>MyAgro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-cover bg-no-repeat bg-[url('/MyAgro/end/images/reg.jpg')]">
    <!-- registration form -->
    <div class="flex flex-col items-center mr-[250px]">
        <div class="flex flex-col items-center">
            <h1 class="font-serif text-6xl mb-3 italic font-bold text-[#30f915]">MyAgro</h1>
            <h2 class="mb-3 text-3xl font-semibold text-white">Register for your MyAgro account</h2>
        </div>
        <div></div>
        <form id="registrasionform" action="" class="flex flex-col items-center font-semibold border rounded-3xl w-[350px] bg-[#D9D9D9]/80">  <!-- bg-[#D9D9D9]/80 -->
            <!-- common field -->
            <div class="flex flex-col w-[330px]" id="commonfield">
                <label for="name" class="mt-1">Enter your name</label>
                <input type="text" id="name" placeholder=" E.g.charitha buddhika " class="rounded-md h-7 placeholder:text-[14px] placeholder:italic" required>
                <label for="username" class="mt-2">Enter your Username</label>
                <input type="text" placeholder=" E.g.charitha" id="username"class="rounded-md h-7 placeholder:italic placeholder:text-[14px]" required>
                <label for="password"class="mt-2">Enter your Password</label>
                <input type="password" placeholder=" pick up your password" id="password" class="rounded-md h-7 placeholder:italic placeholder:text-[14px]" required>
                <label for="userType" class="mt-2">Select your user type</label>
                <select name="userType" id="userType" placeholder="E.g. your farmer select “farmer”" class="mb-2 rounded-lg h-7 placeholder:italic placeholder:text-[14px]" required>
                    <option value="def" disabled selected >Please choose your user type</option>
                    <option value="Farmer" >Farmer</option>
                    <option value="Customer">Customer</option>
                    <option value="Supplier">Supplier</option>
                </select>
            </div>

            <!--cutomer Fields  -->
            <div class="user-type  flex flex-col w-[330px]" id="customfield">
                <label for="name" class="">Enter your address</label>
                <input type="text" id="name" placeholder=" E.g.No 250/3,colombo road,kandy" class="rounded-md h-7 placeholder:text-[14px] placeholder:italic" required>               
                <label for="name" class="mt-2">Enter your Email Address</label>
                <input type="email" id="name" placeholder=" E.g.charit@gmail.com" class="rounded-md h-7 placeholder:text-[14px] placeholder:italic" required>
                <label for="name" class="mt-2">Enter your phone number</label>
                <input type="email" id="name" placeholder=" E.g.0795555555 " class="rounded-md h-7 placeholder:text-[14px] placeholder:italic" required>
                <div class="flex">
                    <button class="mt-6 mr-6 h-8 rounded-full w-[145px] bg-[#6EE70F]/50">
                        <input type="reset" value="Clear" class="focus:cursor-pointer">
                    </button>
                    <button class="mt-6 h-8 rounded-full w-[160px] bg-[#6EE70F]/50 text-[#f9e912] focus:cursor-pointer">
                        <input type="submit" value="Register" class="">
                    </button>
                </div>
                <h1 class="relative mt-5 mb-2 text-sm left-10">Already have an account? <a href="login.html">Login</a></h1>
            </div>

            <!--farmer Fields  -->
            <div class="user-type hidden flex flex-col w-[330px] " id="farmerfield">
                <label for="name" class="">Enter your NIC number</label>
                <input type="text" id="name" placeholder=" E.g.458458756789/258963147 without v or x " class="rounded-md h-7 placeholder:text-[14px] placeholder:italic" required>
                <label for="name" class="mt-2">Enter your address</label>
                <input type="text" id="name" placeholder=" E.g.No 250/3,colombo road,kandy" class="rounded-md h-7 placeholder:text-[14px] placeholder:italic" required>
                <label for="name" class="mt-2">Enter your Email Address</label>
                <input type="email" id="name" placeholder=" E.g.charit@gmail.com" class="rounded-md h-7 placeholder:text-[14px] placeholder:italic" required>
                <label for="name" class="mt-2">Enter your phone number</label>
                <input type="email" id="name" placeholder=" E.g.0795555555 " class="rounded-md h-7 placeholder:text-[14px] placeholder:italic" required>
                <label for="name" class="mt-2">Enter your proof image</label>
                <input type="image" id="name" placeholder=" E.g.0795555555 " class="rounded-md h-[70px] border-4 placeholder:text-[14px] placeholder:italic" required>
                <div class="flex">
                    <button class="mt-6 h-8 mr-6 rounded-full w-[145px] bg-[#6EE70F]/50">
                        <input type="reset" value="Clear" class="focus:cursor-pointer">
                    </button>
                    <button class="mt-6 h-8 rounded-full w-[160px] bg-[#6EE70F]/50 text-[#f9e912] focus:cursor-pointer">
                        <input type="submit" value="Post Appointment " class="">
                    </button>
                </div>
                <h1 class="relative mt-5 mb-2 text-sm left-10">Already have an account? <a href="login.html">Login</a></h1>
            </div>

            <!--supplier Fields  -->
            <div class="user-type hidden flex flex-col w-[330px]" id="supplierfield">
                <label for="name" class="">Enter your NIC number</label>
                <input type="text" id="name" placeholder=" E.g.458458756789/258963147 without v or x " class="rounded-md h-7 placeholder:text-[14px] placeholder:italic" required>
                <label for="name" class="mt-2">Enter your address</label>
                <input type="text" id="name" placeholder=" E.g.No 250/3,colombo road,kandy" class="rounded-md h-7 placeholder:text-[14px] placeholder:italic" required>
                <label for="name" class="mt-2">Enter your Email Address</label>
                <input type="email" id="name" placeholder=" E.g.charit@gmail.com" class="rounded-md h-7 placeholder:text-[14px] placeholder:italic" required>
                <label for="name" class="mt-2">Enter your OTP number</label>
                <input type="email" id="name" placeholder=" E.g.00000" class="rounded-md h-7 placeholder:text-[14px] placeholder:italic" required>
                <label for="name" class="mt-2">Enter your phone number</label>
                <input type="email" id="name" placeholder=" E.g.0795555555 " class="rounded-md h-7 placeholder:text-[14px] placeholder:italic" required>
                <label for="name" class="mt-2">Enter your proof image</label>
                <input type="image" id="name" placeholder=" E.g.0795555555 " class="rounded-md h-[70px] border-4 placeholder:text-[14px] placeholder:italic" required>
                <div class="flex">
                    <button class="mt-5 mr-6 h-8 rounded-full w-[145px] bg-[#6EE70F]/50">
                        <input type="reset" value="Clear" class="focus:cursor-pointer">
                    </button>
                    <button class="mt-5 h-8 rounded-full w-[160px] bg-[#6EE70F]/50 text-[#f9e912] focus:cursor-pointer">
                        <input type="submit" value="Post Appointment " class="">
                    </button>
                </div>
                <h1 class="relative mt-4 text-sm left-10">Already have an account? <a href="login.html">Login</a></h1>
                <button class="absolute top-[480px] left-[700px]">
                    <input type="submit" value="Send OTP" class="mt-6 h-8 rounded-full w-[150px] bg-[#6EE70F]/50 focus:cursor-pointer">
                </button>
            </div>
        </form>
    </div>
    <script>
        document.getElementById('userType').addEventListener('change', function () {
            var userType = this.value;
            var sections = document.querySelectorAll('hidden');
            sections.forEach(function (section) {
                section.style.display = 'none';
            });
            if (userType) {
                document.getElementById(userType + 'field').style.display = 'block';
            }
        });
    </script>

</body>
</html>
