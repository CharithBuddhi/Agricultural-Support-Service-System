<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center h-screen bg-gray-100">
    <div class="max-w-lg p-8 mx-auto text-center bg-white rounded-lg shadow-lg">
        <!-- Icon -->
        <div class="mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-16 h-16 mx-auto text-red-500">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
            </svg>
        </div>

        <!-- Main Message -->
        <h1 class="mb-4 text-3xl font-bold text-gray-800">Screen Too Small!</h1>

        <!-- Description -->
        <p class="mb-8 text-gray-600">
            Unfortunately, the system you're trying to access is only available on larger screens like tablets or computers.
            <br><span class="font-bold">Try accessing it from a device with a larger display!</span>
        </p>

        <!-- Image of Larger Device -->
        <div class="mb-8">
            <img src="images/lap.png" alt="Tablet or Desktop" class="w-2/3 mx-auto md:w-1/2 lg:w-1/3">
        </div>

        <!-- Call to Action -->
        <a href="../end/index.php" class="inline-block px-6 py-3 font-semibold text-white transition bg-blue-500 rounded-full hover:bg-blue-600">
            Go to Homepage
        </a>
    </div>

    <script>
        // Set the minimum width in pixels for tablets or higher (e.g., 768px for most tablets)
        var minWidth = 768;
    
        // Check if the screen width is less than the minimum width
        if (window.innerWidth > minWidth) {
            // Redirect to a warning page or block access
            window.location.href = "index.php";  // Redirect to a warning page
        }
    </script>

</body>
</html>
