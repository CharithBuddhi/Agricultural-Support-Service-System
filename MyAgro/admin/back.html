<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>back</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="">
      <button
        onclick="openPopup()"
        type="submit"
        class="p-2 w-[120px] bg-lime-300 hover:bg-lime-500 active:bg-lime-600 rounded-xl"
      >
        submit
      </button>

      <div
        id="popup"
        class="absolute hidden self-center h-[620px] ml-[400px] p-2 items-center w-[700px] bg-indigo-200 rounded-3xl"
      >
        <img
          src="images/doc.jpg"
          alt="back"
          class="w-[700px] h-[550px] rounded-3xl"
        />
        <button
          onclick="closePopup()"
          type="button"
          class="h-[40px] mt-[8px] relative left-[530px] border-2 border-red-500 rounded-lg w-[150px] bg-lime-400"
        >
          Ok
        </button>
      </div>
    </div>

    <script>
      let popup = document.getElementById("popup");

      function openPopup() {
        popup.classList.remove("hidden");
      }
      function closePopup() {
        popup.classList.add("hidden");
      }
    </script>

<script>

  console.log("First statement");

  // Delays the execution of the function by 2 seconds
  setTimeout(function() {
      console.log("This will be executed after 2 seconds");
  }, 2000);
  
  console.log("Second statement");
  

</script>

  </body>
</html>
